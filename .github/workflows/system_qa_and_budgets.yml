name: System QA & Performance Budgets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  qa_and_budgets:
    name: QA, Rules Validation & Bundle Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Firestore Security Rules
        run: node scripts/validate_security_rules.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run QA Regression Test Suite (34+ Tests)
        run: flutter test test/system_qa_test.dart

      - name: Build Flutter Web (CanvasKit)
        run: flutter build web --release

      - name: Verify Bundle Performance Budgets
        run: node scripts/check_bundle_budget.mjs
