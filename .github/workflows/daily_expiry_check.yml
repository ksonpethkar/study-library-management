name: Daily Study Library Automations (8 AM & 11 PM IST)
# Runs every day at:
# 1) 8:00 AM IST (2:30 AM UTC) - Morning Briefing & Expiry/Grace Processing
# 2) 11:00 PM IST (5:30 PM UTC) - Nightly Financial Settlement & Desk Sync
# 100% FREE on GitHub Actions — uses ~5-10 seconds per run, well within 2,000 min/month free limit

on:
  schedule:
    - cron: '30 2 * * *'   # 2:30 AM UTC = 8:00 AM IST daily (Morning Briefing)
    - cron: '30 17 * * *'  # 5:30 PM UTC = 11:00 PM IST daily (Nightly Settlement)
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin

      - name: Run membership expiry check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check_expiry.js
