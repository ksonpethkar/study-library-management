  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Favicon & Dynamic Branding -->
  <link rel="shortcut icon" href="/app/favicon.ico">
  <link rel="icon" type="image/x-icon" href="/app/favicon.ico">
  <link rel="icon" type="image/png" id="appFavicon" href="/app/favicon.png"/>
  <link rel="manifest" href="/app/manifest.json?v=2">
  <script>
    try {
      const cachedLogo = localStorage.getItem("flutter.cached_library_logo_url") || localStorage.getItem("cached_library_logo_url");
      const cachedName = localStorage.getItem("flutter.cached_library_name") || localStorage.getItem("cached_library_name");
      if (cachedName && cachedName.trim().length > 0) {
        document.title = cachedName;
        const metaTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
        if (metaTitle) metaTitle.setAttribute("content", cachedName);
      }
      if (cachedLogo && cachedLogo.trim().length > 0) {
        const fav = document.getElementById("appFavicon");
        if (fav) fav.href = cachedLogo;
        const appleIcon = document.querySelector("link[rel='apple-touch-icon']");
        if (appleIcon) appleIcon.href = cachedLogo;
      }
    } catch (_) {}

    window.updateWebBranding = function(url, title) {
      try {
        if (title && title.trim().length > 0) {
          document.title = title;
          const metaTitle = document.querySelector("meta[name='apple-mobile-web-app-title']");
          if (metaTitle) metaTitle.setAttribute("content", title);
          try {
            const manifestLink = document.querySelector("link[rel='manifest']");
            if (manifestLink) {
              const dynManifest = {
                "name": title,
                "short_name": title.length > 18 ? title.substring(0, 16) + "…" : title,
                "start_url": "/app/",
                "scope": "/app/",
                "display": "standalone",
                "background_color": "#FFF8F0",
                "theme_color": "#5D4037",
                "description": title + " — Smart Study Library Management Platform",
                "orientation": "portrait-primary",
                "icons": [
                  { "src": (url && url.length > 0) ? url : "/app/icons/Icon-192.png", "sizes": "192x192", "type": "image/png" },
                  { "src": (url && url.length > 0) ? url : "/app/icons/Icon-512.png", "sizes": "512x512", "type": "image/png" }
                ]
              };
              const blob = new Blob([JSON.stringify(dynManifest)], { type: 'application/manifest+json' });
              manifestLink.href = URL.createObjectURL(blob);
            }
          } catch (_) {}
        }
        if (url && url.trim().length > 0) {
          let link = document.getElementById("appFavicon") || document.querySelector("link[rel~='icon']");
          if (!link) {
            link = document.createElement("link");
            link.id = "appFavicon";
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.href = url;
          const appleIcon = document.querySelector("link[rel='apple-touch-icon']");
          if (appleIcon) appleIcon.href = url;
        }
      } catch (e) {
        console.warn("Could not update branding:", e);
      }
    };

    window.updateWebFavicon = function(url) {
      window.updateWebBranding(url, null);
    };
  </script>

  <title>The Cozy Corner Study Centre</title>

<body style="margin:0;padding:0;background:#0F172A;overflow:hidden;">
  <!-- Instant Branded Splash Loader (Zero Blank Screen Guarantee) -->
  <div id="flutter-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0F172A;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:white;z-index:999999;transition:opacity 0.4s ease;">
    <div style="width:68px;height:68px;border-radius:18px;background:#5D4037;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(0,0,0,0.4);margin-bottom:18px;overflow:hidden;">
      <img src="/app/favicon.png" alt="Logo" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerText='??';">
    </div>
    <div style="font-weight:800;font-size:17px;letter-spacing:-0.02em;margin-bottom:6px;color:#F8FAFC;">The Cozy Corner Study Centre</div>
    <div style="font-size:12.5px;color:#94A3B8;margin-bottom:22px;">Launching Smart Study Library...</div>
    <div style="width:140px;height:4px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;position:relative;">
      <div style="position:absolute;left:0;top:0;height:100%;width:40%;background:#F59E0B;border-radius:4px;animation:cozyPulse 1.4s infinite ease-in-out;"></div>
    </div>
    <style>
      @keyframes cozyPulse {
        0% { left: -40%; width: 40%; }
        50% { left: 30%; width: 50%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
    <script>
      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('flutter-loader');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function() { el.remove(); }, 400);
        }
      });
      setTimeout(function() {
        var el = document.getElementById('flutter-loader');
        if (el) el.remove();
      }, 7000);
    </script>

  <!-- jsQR Client-Side Instant QR Code Decoder for Indian Gov IDs (PAN, Aadhaar, DL) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"
          integrity="sha256-MiFMdO6S033m2IJ2mHaQ2ZbOdXZo6CyhcJ26Xgvp/M4="
          crossorigin="anonymous"></script>
  <!-- Tesseract.js Client-Side OCR for Web -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
          integrity="sha256-qOKZGNCYsrBuEBK9rv+0rsBEXF1WVHCQI+C9H0QqgOg="
          crossorigin="anonymous"></script>
  <script>
    // â”€â”€ Instant Client-Side QR Decoder â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    window.decodeQrCodeFromImage = async function(base64Image) {
      try {
        if (!window.jsQR) {
          console.warn("jsQR library not available");
          return null;
        }
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.onload = () => {
            try {
              // 1. Try scanning at native resolution
              const canvas = document.createElement("canvas");
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext("2d", { willReadFrequently: true });
              ctx.drawImage(img, 0, 0);
              let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              let code = jsQR(imgData.data, imgData.width, imgData.height, {
                inversionAttempts: "attemptBoth"
              });

              // 2. If not found and image is large (>1000px), downsample to 1000px width
              if (!code && (img.width > 1000 || img.height > 1000)) {
                const scale = Math.min(1000 / img.width, 1000 / img.height);
                const sWidth = Math.round(img.width * scale);
                const sHeight = Math.round(img.height * scale);
                const sCanvas = document.createElement("canvas");
                sCanvas.width = sWidth;
                sCanvas.height = sHeight;
                const sCtx = sCanvas.getContext("2d", { willReadFrequently: true });
                sCtx.drawImage(img, 0, 0, sWidth, sHeight);
                const sData = sCtx.getImageData(0, 0, sWidth, sHeight);
                code = jsQR(sData.data, sWidth, sHeight, {
                  inversionAttempts: "attemptBoth"
                });
              }

              if (code && code.data && code.data.trim().length > 0) {
                console.log("QR Code decoded successfully from ID card:", code.data.substring(0, 60));
                resolve(code.data);
              } else {
                resolve(null);
              }
            } catch (err) {
              console.warn("QR canvas read error:", err);
              resolve(null);
            }
          };
          img.onerror = () => resolve(null);
          img.src = base64Image;
        });
      } catch (err) {
        console.warn("QR decode error:", err);
        return null;
      }
    };

    // â”€â”€ Client-Side Tesseract OCR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let _sharedTesseractWorker = null;
    window.recognizeOcrText = async function(base64Image) {
      try {
        if (!window.Tesseract) {
          console.warn("Tesseract.js not yet loaded");
          return "";
        }
        // Lazy-create worker once for fast recognition
        if (!_sharedTesseractWorker) {
          _sharedTesseractWorker = await Tesseract.createWorker("eng");
        }
        const ret = await _sharedTesseractWorker.recognize(base64Image);
        return (ret && ret.data && ret.data.text) ? ret.data.text : "";
      } catch (err) {
        console.error("Tesseract recognition error:", err);
        // Reset worker on failure
        _sharedTesseractWorker = null;
        return "";
      }
    };
  </script>
