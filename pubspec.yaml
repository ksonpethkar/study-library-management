name: study_library
description: "Smart Study Library Management - Manage seats, students, memberships & more"
publish_to: 'none'
version: 1.5.50+62

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.9
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  lottie: ^3.6.1
  shimmer: ^4.0.0
  flutter_slidable: ^4.0.3
  cached_network_image: ^4.0.0
  flutter_svg: ^2.3.0

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.1

  # Firebase
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  firebase_storage: 14.0.1
  firebase_messaging: 17.0.1
  firebase_remote_config: 7.0.1
  firebase_crashlytics: 6.0.1
  firebase_analytics: 13.0.1
  firebase_app_check: 0.5.1

  # Google Sign-In
  google_sign_in: ^7.2.0

  # OCR
  google_mlkit_text_recognition: ^0.17.1

  # Camera & Image
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  permission_handler: ^13.0.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # PDF & Printing
  pdf: ^3.13.1
  printing: ^5.15.1

  # Biometric Auth
  local_auth: ^3.0.2

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.7

  # File & Data
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  csv: ^8.0.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # Connectivity
  connectivity_plus: ^7.3.1

  # Utilities
  intl: ^0.20.3
  path: ^1.9.0
  archive: ^4.0.2
  uuid: ^4.6.0
  collection: ^1.19.1
  logger: ^2.8.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  shared_preferences: ^2.5.5
  riverpod: ^3.4.3
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.3.1
  quick_actions: ^1.0.7
  flutter_secure_storage: ^11.2.0
  timezone: ^0.11.1
  image: ^4.12.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  riverpod_lint: ^3.1.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/fonts/




