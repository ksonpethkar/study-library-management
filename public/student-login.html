<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyLib">
  <title>Student Self-Service Portal — Study Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest-student.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/themeManager.js"></script>
  <script>
    (function() {
      try {
        const cached = localStorage.getItem('sl_public_profile_cache');
        if (cached) {
          const bp = JSON.parse(cached);
          if (bp && bp.businessName) {
            document.addEventListener('DOMContentLoaded', function() {
              const el = document.getElementById('lib-name');
              if (el) el.textContent = bp.businessName;
            });
          }
        }
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      --portal-brand-1: #6366f1;
      --portal-brand-2: #06b6d4;
      --portal-brand-3: #10b981;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 1.5rem 1rem;
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15), transparent 45%),
                  radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.14), transparent 45%),
                  var(--color-bg-primary, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family, 'Outfit', -apple-system, sans-serif);
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    .portal-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface, #1e293b);
      border: 1px solid var(--color-border, rgba(255,255,255,0.1));
      border-radius: 24px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .portal-header {
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #ffffff;
      padding: 2.25rem 1.75rem 1.75rem 1.75rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .portal-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .portal-body {
      padding: 1.75rem 1.75rem 1.5rem 1.75rem;
    }
    .theme-toggle-pill {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 1rem;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 2;
    }
    .theme-toggle-pill:hover {
      transform: scale(1.1);
    }
    .theme-toggle-pill:active {
      transform: scale(0.95);
    }
    .quick-helper-box {
      background: var(--color-bg-secondary, rgba(0,0,0,0.03));
      border: 1px solid var(--color-border, rgba(255,255,255,0.08));
      border-radius: 16px;
      padding: 14px;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast-popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.88rem;
      color: #fff;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: slideDownToast 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      white-space: nowrap;
    }
    @keyframes slideDownToast {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (max-width: 540px) {
      body {
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: 100dvh !important;
        justify-content: flex-start !important;
        background: var(--color-surface, #ffffff) !important;
      }
      .portal-card {
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 0 !important;
        border: none !important;
        box-shadow: none !important;
        min-height: 100dvh !important;
      }
      .portal-header {
        padding: 2.25rem 1.25rem 1.5rem 1.25rem !important;
      }
      .portal-body {
        padding: 1.5rem 1.25rem !important;
      }
    }
  </style>
</head>
<body>

  <!-- Portal Card -->
  <div class="portal-card">
    <div class="portal-header">
      <button type="button" class="theme-toggle-pill" onclick="toggleStudentTheme()" title="Toggle Dark/Light Mode" id="portal-theme-btn">
        🌙
      </button>
      <div id="portal-brand-logo" style="font-size: 2.75rem; margin-bottom: 0.35rem; display: flex; align-items: center; justify-content: center; height: 60px;">🎓</div>
      <h1 id="lib-name" style="margin: 0; font-size: 1.65rem; font-weight: 800; letter-spacing: -0.5px;">Student Portal</h1>
      <p style="margin: 4px 0 0 0; opacity: 0.92; font-size: 0.88rem; font-weight: 500;">Self-Service Learning Pass &amp; Campus Hub</p>
    </div>

    <div class="portal-body">
      <button type="button" class="btn btn-outline-primary btn-pwa-install mb-3" id="btn-pwa-student-install" style="width: 100%; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px 14px;">
        📲 Install Student App on Phone
      </button>

      <form id="student-login-form">
        
        <div class="form-group mb-3">
          <label class="form-label" for="student-identifier" style="font-weight: 700; font-size: 0.88rem;">
            Student ID or Mobile Number
          </label>
          <input type="text" id="student-identifier" class="form-control form-control-lg" 
                 placeholder="e.g. STU-2026-0001 or 9876543210" required autocomplete="username" autofocus
                 style="border-radius: 12px; font-weight: 600; font-size: 0.95rem;">
          <small class="text-muted" style="display:block; font-size:0.75rem; margin-top:4px;">
            Enter the 10-digit mobile number used during registration or your Student ID.
          </small>
        </div>

        <div class="form-group mb-4">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label class="form-label mb-0" for="student-password" style="font-weight: 700; font-size: 0.88rem;">
              Password / PIN
            </label>
            <a href="#" onclick="requestCredentialsRecovery(event)" style="color: var(--color-primary); font-size: 0.78rem; font-weight: 600; text-decoration: none;">
              Forgot PIN?
            </a>
          </div>
          <div style="position: relative;">
            <input type="password" id="student-password" class="form-control form-control-lg" 
                   placeholder="Enter your secret password or PIN" style="padding-right: 48px; border-radius: 12px; font-weight: 600;" autocomplete="current-password">
            <button type="button" class="btn btn-icon btn-ghost" id="toggle-pwd-btn" 
                    style="position: absolute; right: 8px; top: 8px; color: var(--color-text-muted);" title="Show/Hide Password">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-lg w-full justify-center mb-2" 
                style="background: linear-gradient(135deg, #4f46e5, #06b6d4); border: none; font-weight: 800; font-size: 1rem; border-radius: 14px; box-shadow: 0 4px 18px rgba(79, 70, 229, 0.35); min-height: 48px;">
          🎓 Enter Student Portal
        </button>

      </form>

      <!-- Quick Self-Service Links -->
      <div class="quick-helper-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>🆕 New to our study library?</span>
          <a href="/register" style="color: var(--color-primary); font-weight: 800; text-decoration: none;">
            Apply Online ➔
          </a>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-divider); padding-top: 8px;">
          <span>💬 Need help logging in?</span>
          <a href="#" onclick="requestCredentialsRecovery(event)" style="color: var(--color-success); font-weight: 700; text-decoration: none;">
            Get ID on WhatsApp 💬
          </a>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top: 1.25rem; text-align: center; font-size: 0.85rem;">
    <a href="/landing" style="color: var(--color-text-secondary); text-decoration: none; font-weight: 600;">← Back to Public Website</a>
  </div>

  <script>
    function applyStudentTheme(theme) {
      const isDark = theme === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark-theme', isDark);
      document.body.classList.toggle('dark-theme', isDark);
      localStorage.setItem('sl_theme', isDark ? 'dark' : 'light');

      const btn = document.getElementById('portal-theme-btn');
      if (btn) {
        btn.textContent = isDark ? '☀️' : '🌙';
        btn.title = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
      }
    }

    window.toggleStudentTheme = function() {
      const currentAttr = document.documentElement.getAttribute('data-theme');
      const hasDarkClass = document.documentElement.classList.contains('dark-theme') || document.body.classList.contains('dark-theme');
      const isCurrentlyDark = currentAttr === 'dark' || hasDarkClass;
      applyStudentTheme(isCurrentlyDark ? 'light' : 'dark');
    };

    // Initialize saved theme
    const savedTheme = localStorage.getItem('sl_theme') || 'light';
    applyStudentTheme(savedTheme);

    // Password Visibility Toggle
    document.getElementById('toggle-pwd-btn')?.addEventListener('click', () => {
      const pwd = document.getElementById('student-password');
      if (pwd) pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Toast Function
    function showToast(msg, isSuccess = true) {
      const toast = document.createElement('div');
      toast.className = 'toast-popup';
      toast.style.background = isSuccess ? '#00b894' : '#d63031';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    document.getElementById('btn-pwa-student-install')?.addEventListener('click', async () => {
      try {
        const module = await import('./js/pwaManager.js');
        if (module && module.promptPWAInstall) module.promptPWAInstall();
      } catch (e) {
        showToast('App installation ready in browser menu', true);
      }
    });

    // Credentials Recovery Helper
    window.requestCredentialsRecovery = async function(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById('student-identifier');
      let identifier = inputEl?.value?.trim();

      if (!identifier) {
        identifier = prompt('Please enter your Registered Mobile Number, Student ID, or Email for password recovery:');
        if (!identifier) {
          if (inputEl) inputEl.focus();
          return;
        }
      }

      showToast('Preparing WhatsApp Recovery Link...', true);

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, portalType: 'student' })
        });
        const data = await res.json();

        if (data.success && data.data?.whatsappUrl) {
          showToast(data.message || 'Opening WhatsApp...', true);
          // Open WhatsApp directly
          window.location.href = data.data.whatsappUrl;
        } else {
          showToast(data.message || 'Account recovery failed. Please check your Student ID / Mobile Number.', false);
        }
      } catch (err) {
        showToast('Network error during account recovery.', false);
      }
    };

    // Student Login Submit Handler
    document.getElementById('student-login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('student-identifier').value.trim();
      const password = document.getElementById('student-password').value.trim();
      const btn = document.getElementById('btn-login-submit');

      if (!identifier) {
        showToast('Please enter your Student ID or Mobile number', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying Credentials...';

      try {
        const res = await fetch('/api/auth/student-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('sl_token', data.data.token);
          showToast(`Welcome back, ${data.data.student?.name || 'Student'}!`, true);
          setTimeout(() => {
            window.location.href = '/#/portal';
          }, 800);
        } else {
          showToast(data.message || 'Login failed. Please check your credentials.', false);
          btn.disabled = false;
          btn.textContent = '🎓 Enter Student Portal';
        }
      } catch (err) {
        showToast('Network error. Please try again.', false);
        btn.disabled = false;
        btn.textContent = '🎓 Enter Student Portal';
      }
    });

    // Fetch Library Branding Name & Logo
    fetch('/api/landing')
      .then(res => res.json())
      .then(data => {
        const bp = data.data?.businessProfile;
        if (bp?.businessName) {
          document.getElementById('lib-name').textContent = bp.businessName;
        }
        if (bp?.logo) {
          const logoEl = document.getElementById('portal-brand-logo');
          if (logoEl) {
            logoEl.innerHTML = `<img src="${bp.logo}" alt="Logo" style="max-height: 56px; max-width: 120px; object-fit: contain; border-radius: 8px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));">`;
          }
        }
        if (bp?.bannerImage) {
          const headerEl = document.querySelector('.portal-header');
          if (headerEl) {
            headerEl.style.backgroundImage = `linear-gradient(135deg, rgba(108, 92, 231, 0.88), rgba(0, 184, 148, 0.88)), url("${bp.bannerImage}")`;
            headerEl.style.backgroundSize = 'cover';
            headerEl.style.backgroundPosition = 'center';
          }
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
