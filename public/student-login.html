<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyLib">
  <title>Student Self-Service Portal — Study Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(0, 184, 148, 0.12), transparent 45%),
                  var(--color-bg-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: var(--font-family);
    }
    .portal-card {
      width: 100%;
      max-width: 440px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      position: relative;
    }
    .portal-header {
      background: linear-gradient(135deg, #6c5ce7, #00b894);
      color: #ffffff;
      padding: 2.25rem 2rem 1.75rem 2rem;
      text-align: center;
      position: relative;
    }
    .portal-body {
      padding: 2rem 2rem 1.75rem 2rem;
    }
    .theme-toggle-pill {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      transition: transform 0.2s;
    }
    .theme-toggle-pill:hover {
      transform: scale(1.1);
    }
    .quick-helper-box {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast-popup {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      color: #fff;
      z-index: 9999;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.3s ease forwards;
    }
  </style>
</head>
<body>

  <!-- Portal Card -->
  <div class="portal-card">
    <div class="portal-header">
      <button type="button" class="theme-toggle-pill" onclick="toggleStudentTheme()" title="Toggle Dark/Light Mode" id="portal-theme-btn">
        🌙
      </button>
      <div style="font-size: 2.75rem; margin-bottom: 0.25rem;">🎓</div>
      <h1 id="lib-name" style="margin: 0; font-size: 1.65rem; font-weight: 800; letter-spacing: -0.5px;">Student Portal</h1>
      <p style="margin: 4px 0 0 0; opacity: 0.92; font-size: 0.88rem;">Study Library & Reading Hall Self-Service</p>
    </div>

    <div class="portal-body">
      <button type="button" class="btn btn-outline-primary btn-pwa-install mb-3" id="btn-pwa-student-install" style="width: 100%; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        📲 Install App on Phone
      </button>

      <form id="student-login-form">
        
        <div class="form-group mb-3">
          <label class="form-label" for="student-identifier" style="font-weight: 600; font-size: 0.88rem;">
            Student ID or Mobile Number
          </label>
          <input type="text" id="student-identifier" class="form-control form-control-lg" 
                 placeholder="e.g. STU-2026-001 or 9876543210" required autocomplete="username" autofocus>
          <small class="text-muted" style="display:block; font-size:0.75rem; margin-top:4px;">
            Enter the 10-digit phone used during admission or your Student ID.
          </small>
        </div>

        <div class="form-group mb-4">
          <label class="form-label" for="student-password" style="font-weight: 600; font-size: 0.88rem;">
            Password / PIN
          </label>
          <div style="position: relative;">
            <input type="password" id="student-password" class="form-control form-control-lg" 
                   placeholder="Enter your password or PIN" style="padding-right: 48px;" autocomplete="current-password">
            <button type="button" class="btn btn-icon btn-ghost" id="toggle-pwd-btn" 
                    style="position: absolute; right: 8px; top: 8px; color: var(--color-text-muted);" title="Show/Hide Password">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-lg w-full justify-center mb-3" 
                style="background: linear-gradient(135deg, #6c5ce7, #00b894); border: none; font-weight: 800; font-size: 1rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.35);">
          🎓 Enter Student Portal
        </button>

        <div style="display: flex; align-items: center; margin: 1rem 0; gap: 10px;">
          <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
          <span style="font-size: 0.78rem; color: var(--color-text-secondary); font-weight: 600; text-transform: uppercase;">OR SMART SIGN-IN</span>
          <div style="flex: 1; height: 1px; background: var(--color-border);"></div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button type="button" id="btn-google-signin" class="btn btn-secondary w-full justify-center" style="border-radius: 12px; font-weight: 700; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; gap: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Sign in with Google
          </button>

          <button type="button" id="btn-passkey-signin" class="btn btn-secondary w-full justify-center" style="border-radius: 12px; font-weight: 700; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; gap: 8px;">
            🔑 Sign in with Google Passkey / Biometrics
          </button>
        </div>

      </form>

      <!-- Quick Self-Service Links -->
      <div class="quick-helper-box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>🆕 New to our library?</span>
          <a href="/register" style="color: var(--color-primary); font-weight: 700; text-decoration: none;">
            Apply Online ➔
          </a>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-divider); padding-top: 6px;">
          <span>❓ Forgot Student ID / PIN?</span>
          <a href="#" onclick="requestCredentialsRecovery(event)" style="color: var(--color-success); font-weight: 600; text-decoration: none;">
            Get on WhatsApp 💬
          </a>
        </div>
      </div>
    </div>
  </div>

  <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
    <a href="/landing" style="color: var(--color-text-secondary); text-decoration: none;">← Back to Public Website</a>
  </div>

  <script>
    // Theme Management
    window.toggleStudentTheme = function() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.documentElement.classList.toggle('dark-theme', next === 'dark');
      document.body.classList.toggle('dark-theme', next === 'dark');
      localStorage.setItem('sl_theme', next);
      const btn = document.getElementById('portal-theme-btn');
      if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
    };

    const savedTheme = localStorage.getItem('sl_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.documentElement.classList.toggle('dark-theme', savedTheme === 'dark');
    document.body.classList.toggle('dark-theme', savedTheme === 'dark');
    const themeBtn = document.getElementById('portal-theme-btn');
    if (themeBtn) themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    // Password Visibility Toggle
    document.getElementById('toggle-pwd-btn')?.addEventListener('click', () => {
      const pwd = document.getElementById('student-password');
      if (pwd) pwd.type = pwd.type === 'password' ? 'text' : 'password';
    });

    // Toast Function
    function showToast(msg, isSuccess = true) {
      const toast = document.createElement('div');
      toast.className = 'toast-popup';
      toast.style.background = isSuccess ? '#00b894' : '#d63031';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    document.getElementById('btn-pwa-student-install')?.addEventListener('click', async () => {
      try {
        const module = await import('./js/pwaManager.js');
        if (module && module.promptPWAInstall) module.promptPWAInstall();
      } catch (e) {
        showToast('App installation ready in browser menu', true);
      }
    });

    // Credentials Recovery Helper
    window.requestCredentialsRecovery = async function(e) {
      if (e) e.preventDefault();
      const existingId = document.getElementById('student-identifier')?.value?.trim();
      const identifier = prompt('Enter your Registered Mobile Number, Student ID, or Email for password recovery:', existingId || '');
      if (!identifier) return;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, portalType: 'student' })
        });
        const data = await res.json();

        if (data.success && data.data?.whatsappUrl) {
          showToast(data.message || 'Recovery request prepared!', true);
          setTimeout(() => {
            window.open(data.data.whatsappUrl, '_blank');
          }, 600);
        } else {
          showToast(data.message || 'Account recovery failed.', false);
        }
      } catch (err) {
        showToast('Network error during account recovery.', false);
      }
    };

    // Google Sign-In Handler
    document.getElementById('btn-google-signin')?.addEventListener('click', async () => {
      const existingId = document.getElementById('student-identifier')?.value?.trim();
      const identifier = prompt('Enter your registered Google Email, Mobile Number, or Student ID:', existingId || '');
      if (!identifier) return;

      try {
        const res = await fetch('/api/auth/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, email: identifier, portalType: 'student' })
        });
        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('sl_token', data.data.token);
          showToast(`Welcome back via Google, ${data.data.student?.name || 'Student'}!`, true);
          setTimeout(() => {
            window.location.href = '/#/portal';
          }, 800);
        } else {
          showToast(data.message || 'Google sign-in failed. Please verify your registered details.', false);
        }
      } catch (err) {
        showToast('Network error during Google sign-in.', false);
      }
    });

    // Passkey / Biometrics Handler
    document.getElementById('btn-passkey-signin')?.addEventListener('click', async () => {
      const id = document.getElementById('student-identifier')?.value?.trim() || prompt('Enter your Student ID or Phone number for Passkey unlocking:');
      if (!id) return;

      try {
        if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
          await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        }
        
        const res = await fetch('/api/auth/passkey-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: id, portalType: 'student' })
        });
        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('sl_token', data.data.token);
          showToast(`Unlocked via Biometrics! Welcome, ${data.data.student?.name || 'Student'}.`, true);
          setTimeout(() => {
            window.location.href = '/#/portal';
          }, 800);
        } else {
          showToast(data.message || 'Passkey authentication failed.', false);
        }
      } catch (err) {
        showToast('Passkey verification failed.', false);
      }
    });

    // Student Login Submit Handler
    document.getElementById('student-login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('student-identifier').value.trim();
      const password = document.getElementById('student-password').value.trim();
      const btn = document.getElementById('btn-login-submit');

      if (!identifier) {
        showToast('Please enter your Student ID or Mobile number', false);
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying Credentials...';

      try {
        const res = await fetch('/api/auth/student-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();

        if (data.success && data.data?.token) {
          localStorage.setItem('sl_token', data.data.token);
          showToast(`Welcome back, ${data.data.student?.name || 'Student'}!`, true);
          setTimeout(() => {
            window.location.href = '/#/portal';
          }, 800);
        } else {
          showToast(data.message || 'Login failed. Please check your credentials.', false);
          btn.disabled = false;
          btn.textContent = '🎓 Enter Student Portal';
        }
      } catch (err) {
        showToast('Network error. Please try again.', false);
        btn.disabled = false;
        btn.textContent = '🎓 Enter Student Portal';
      }
    });

    // Fetch Library Branding Name
    fetch('/api/landing')
      .then(res => res.json())
      .then(data => {
        if (data.data?.businessProfile?.businessName) {
          document.getElementById('lib-name').textContent = data.data.businessProfile.businessName;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
