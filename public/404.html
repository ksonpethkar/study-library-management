<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cozy Corner Study Centre</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <meta http-equiv="refresh" content="1; url=/app">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 420px;
      margin: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(234,88,12,0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }
    p {
      margin: 0 0 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    a {
      display: inline-block;
      padding: 10px 20px;
      background: #ea580c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to Study Centre...</h2>
    <p>We are connecting you to your library session.</p>
    <a href="/app">Open App</a>
  </div>
  <script>
    // If the path was intended for the Flutter SPA, rewrite path
    var path = window.location.pathname;
    if (path && path !== '/' && !path.startsWith('/app')) {
      window.location.replace('/app' + path);
    } else {
      setTimeout(function() {
        window.location.replace('/app');
      }, 1000);
    }
  </script>
</body>
</html>
